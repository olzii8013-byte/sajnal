name: Forex Signal Check

on:
  schedule:
    - cron: "*/15 * * * *"   # 15 минут тутам (GitHub cron UTC цагаар)
  workflow_dispatch: {}       # Actions табнаас гараар дарж турших боломж

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests

      - name: Run signal check
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOL: "EUR/USD"
          INTERVAL: "15min"
        run: python oanda_signal_check.py

      - name: Commit updated signal state (if changed)
        run: |
          git config user.name "signal-bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add last_signal.txt || true
          git diff --staged --quiet || git commit -m "update last signal"
          git push || true
